services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./ops/observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
      - otel-queue:/var/lib/otelcol
    depends_on:
      - loki
      - tempo
    restart: unless-stopped
    networks: [observability]

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on: [otel-collector, alertmanager, backup-exporter]
    restart: unless-stopped
    networks: [observability]

  backup-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    volumes:
      - ${BACKUP_METRICS_PATH:-/var/lib/morrus-pos/backup-metrics}:/var/lib/node_exporter/textfile_collector:ro
    restart: unless-stopped
    networks: [observability]

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./ops/observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks: [observability]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./ops/observability/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    networks: [observability]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./ops/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets: [alert_webhook_url]
    restart: unless-stopped
    networks: [observability]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD wajib diisi}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped
    networks: [observability]

volumes:
  otel-queue:
  prometheus-data:
  loki-data:
  tempo-data:
  alertmanager-data:
  grafana-data:

secrets:
  alert_webhook_url:
    file: ${ALERT_WEBHOOK_FILE:-./ops/observability/secrets/alert_webhook_url}
