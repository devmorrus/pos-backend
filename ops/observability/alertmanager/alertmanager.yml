global:
  resolve_timeout: 5m

route:
  receiver: platform-webhook
  group_by: [alertname, severity, team]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: platform-webhook
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
