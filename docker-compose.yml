name: morrus-pos

services:
  database:
    image: postgres:15-alpine
    container_name: morruspos_db
    environment:
      POSTGRES_DB: morrusposs
      POSTGRES_USER: morrus
      POSTGRES_PASSWORD: ${MORRUS_MIGRATION_PASSWORD:?MORRUS_MIGRATION_PASSWORD wajib diisi}
      MORRUS_APP_PASSWORD: ${MORRUS_APP_PASSWORD:?MORRUS_APP_PASSWORD wajib diisi}
      MORRUS_SYSTEM_PASSWORD: ${MORRUS_SYSTEM_PASSWORD:?MORRUS_SYSTEM_PASSWORD wajib diisi}
      MORRUS_MIGRATION_PASSWORD: ${MORRUS_MIGRATION_PASSWORD:?MORRUS_MIGRATION_PASSWORD wajib diisi}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/tenant-roles.sql:/docker-entrypoint-initdb.d/001-tenant-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morrus -d morrusposs"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morruspos_backend
    ports:
      - "8085:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=morrusposs;Username=morrus_app;Password=${MORRUS_APP_PASSWORD:?MORRUS_APP_PASSWORD wajib diisi}
      - ConnectionStrings__SystemConnection=Host=database;Port=5432;Database=morrusposs;Username=morrus_system;Password=${MORRUS_SYSTEM_PASSWORD:?MORRUS_SYSTEM_PASSWORD wajib diisi}
      - ConnectionStrings__MigrationConnection=Host=database;Port=5432;Database=morrusposs;Username=morrus_migration;Password=${MORRUS_MIGRATION_PASSWORD:?MORRUS_MIGRATION_PASSWORD wajib diisi}
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET wajib diisi}
      - Jwt__Issuer=MorrusPOS
      - Jwt__Audience=MorrusPOS.Client
      - Jwt__AccessTokenMinutes=60
      - Frontend__Url=https://pos.morrusdigitalconnecting.com,http://localhost:5173
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - Observability__Enabled=${OBSERVABILITY_ENABLED:-false}
      - Observability__ServiceName=morruspos-api
      - Observability__OtlpEndpoint=http://otel-collector:4317
      - Observability__TraceSampleRatio=${OTEL_TRACE_SAMPLE_RATIO:-1}
      - SERVICE_VERSION=${SERVICE_VERSION:-local}
      - QueueMonitoring__Enabled=${QUEUE_MONITORING_ENABLED:-true}
      - QueueMonitoring__EvaluateBacklog=${QUEUE_EVALUATE_BACKLOG:-false}
      - QueueMonitoring__PollIntervalSeconds=${QUEUE_POLL_INTERVAL_SECONDS:-30}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - uploads:/app/wwwroot/uploads
    networks:
      - default
      - observability
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ../pos-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://api-pos.morrusdigitalconnecting.com
        - VITE_SIGNALR_URL=https://api-pos.morrusdigitalconnecting.com/hub/notifications
    container_name: morruspos_frontend
    ports:
      - "8086:80"
    depends_on:
      - backend

volumes:
  pgdata:
    name: ${POSTGRES_DATA_VOLUME_NAME:-morrus-pos_pgdata}
  uploads:
    name: ${UPLOADS_VOLUME_NAME:-morrus-pos_uploads}

networks:
  observability:
    internal: true
