name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  dotnet-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MorrusPOS.sln

      - name: Build solution
        run: dotnet build MorrusPOS.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/MorrusPOS.UnitTests/MorrusPOS.UnitTests.csproj --configuration Release --no-build --verbosity normal
